<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perplexity — Dark Theme</title>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!--
    NOTE: This recreates the Perplexity AI homepage layout in a dark theme
    using the provided custom CSS variable color system.
    Layout: Left sidebar + top nav + centered hero search UI.
  -->

  <style>
    /* ─── CSS VARIABLES (user-provided palette) ─── */
    :root {
      --0: rgb(0 0 0 / 0);
      --a: #3afacb;
      --a-t: rgb(58 250 203 / 22%);
      --aa: #00d7a3;
      --aa-t: rgb(0 215 163 / 22%);
      --aaa: linear-gradient(135deg, #2BB9C2 0%, #39D3C6 35%, #2FE0B7 65%, #18C79C 100%);
      --lgaa: linear-gradient(135deg, #2BB9C2 0%, #39D3C6 35%, #2FE0B7 65%, #18C79C 100%);
      --b: #04090d;
      --bt: rgb(4 9 13 / 44%);
      --b-t: rgb(9 18 24 / 44%);
      --b1: #0a1218;
      --b1-t: rgb(10 18 24 / 88%);
      --bg: rgba(0, 0, 0, .75);
      --bg-t: rgb(0 0 0 / 44%);
      --bcc: #0c141a;
      --b-t22: rgb(255 255 255 / 22%);
      --b-t44: rgb(255 255 255 / 44%);
      --b-t77: rgb(255 255 255 / 77%);
      --b-t88: #151827;
      --b-t95: #2D2F3E;
      --bc: rgb(255 255 255 / 6%);
      --bc-t: rgb(255 255 255 / 10%);
      --bor: rgb(255 255 255 / 10%);
      --c: #e8f6ff;
      --c-t: rgb(232 246 255 / 77%);
      --c0: #8fa3ad;
      --c0-t: rgb(143 163 173 / 77%);
      --c1: #0f1b22;
      --c1-t: rgb(15 27 34 / 77%);
      --btn: linear-gradient(135deg, #2BB9C2 0%, #39D3C6 35%, #2FE0B7 65%, #18C79C 100%);
      --btn1: var(--btn);
      --btn2: var(--btn);
      --btn3: var(--btn);
      --btn4: var(--btn);
      --ff: 'Poppins', sans-serif;
      --fs: 1em;
      --fs-xl: 4em;
      --fs-l: 2em;
      --fs-m: 1em;
      --fs-s: .77em;
      --fs-xs: .44em;
      --fw-n: 400;
      --fw-b: 700;
      --lh: 1.5;
      --s: 18px;
      --s-xl: 44px;
      --s-l: 18px;
      --s-m: 11px;
      --s-s: 7px;
      --s-xs: 4px;
      --br: 22px;
      --br-xl: 44px;
      --br-l: 22px;
      --br-m: 11px;
      --br-s: 7px;
      --br-xs: 4px;
      --z1: 1000;
      --z2: 999;
      --z3: 998;
      --t-fast: .2s ease-in-out;
      --t-normal: .3s ease-in-out;
      --t-slow: .5s ease-in-out;
      --bss: 0 14px 40px rgb(0 0 0 / 65%);
      --bs-bs: 0 0 2px rgb(0 0 0 / 80%), 0 14px 40px rgb(0 0 0 / 65%), inset 0 0 0 .5px rgb(255 255 255 / 10%);
      --lg: linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.08), rgba(255,255,255,.03));
      --lg1: linear-gradient(90deg, rgba(58,250,203,.06), rgba(58,250,203,.18), rgba(58,250,203,.06));
      --lg-b: linear-gradient(135deg, #3afacb 0%, #00d7a3 50%, #7dffcf 100%);
      --blur: blur(44px);
      --blur-s: blur(22px);
      --nx-glow: rgb(57 211 198 / 35%);
      --nx-glow-strong: rgb(47 224 183 / 55%);
    }

    /* ─── RESET ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: var(--ff); background: var(--b); color: var(--c); }

    /* ─── APP WRAPPER ─── */
    /* CSS: Full-height flex layout matching screenshot's two-column structure */
    app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ════════════════════════════════════════
       SIDEBAR
    ════════════════════════════════════════ */
    /* CSS: Left sidebar — dark panel with nav items, matching screenshot width ~160px */
    sdbar {
      display: flex;
      flex-direction: column;
      width: 168px;
      min-width: 168px;
      background: var(--b1);
      border-right: 1px solid var(--bor);
      padding: var(--s-m) 0;
      position: relative;
      z-index: var(--z1);
      transition: width var(--t-normal);
    }

    /* CSS: Sidebar header — logo + collapse toggle */
    sdbar hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--s-s) var(--s-m) var(--s-m);
    }

    /* CSS: Logo icon — teal gradient star-like shape */
    .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--btn);
      border-radius: var(--br-s);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--b);
      box-shadow: 0 0 14px var(--nx-glow);
      flex-shrink: 0;
    }

    .logo-icon i { font-size: 13px; }

    /* CSS: Sidebar toggle button */
    .sdbar-toggle {
      background: none;
      border: none;
      color: var(--c0);
      cursor: pointer;
      padding: var(--s-xs);
      border-radius: var(--br-xs);
      font-size: 13px;
      transition: color var(--t-fast), background var(--t-fast);
    }
    .sdbar-toggle:hover { color: var(--c); background: var(--bc-t); }

    /* CSS: Sidebar body — nav list */
    sdbar bd {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: var(--s-xs) var(--s-s);
      gap: 2px;
      overflow-y: auto;
    }

    /* CSS: Nav item — icon + label row */
    navi {
      display: flex;
      align-items: center;
      gap: var(--s-s);
      padding: 8px var(--s-s);
      border-radius: var(--br-s);
      cursor: pointer;
      font-size: var(--fs-s);
      color: var(--c0);
      transition: background var(--t-fast), color var(--t-fast);
      white-space: nowrap;
      overflow: hidden;
    }
    navi:hover { background: var(--bc-t); color: var(--c); }
    navi.active {
      background: var(--a-t);
      color: var(--a);
    }
    navi i {
      font-size: 14px;
      width: 16px;
      text-align: center;
      flex-shrink: 0;
    }
    navi.active i { color: var(--a); }

    /* CSS: "No recent threads" label in sidebar */
    .no-threads {
      font-size: var(--fs-xs);
      color: var(--c0-t);
      padding: var(--s-s) var(--s-m);
      letter-spacing: .02em;
    }

    /* CSS: Sidebar footer — Sign In button */
    sdbar ft {
      padding: var(--s-s);
      border-top: 1px solid var(--bor);
    }

    .signin-row {
      display: flex;
      align-items: center;
      gap: var(--s-s);
      padding: 9px var(--s-s);
      border-radius: var(--br-s);
      cursor: pointer;
      transition: background var(--t-fast);
    }
    .signin-row:hover { background: var(--bc-t); }

    .signin-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--b-t95);
      border: 1px solid var(--bor);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--c0);
      flex-shrink: 0;
    }

    .signin-label {
      font-size: var(--fs-s);
      color: var(--c0);
      flex: 1;
    }

    .signin-expand {
      font-size: 10px;
      color: var(--c0);
    }

    /* ════════════════════════════════════════
       MAIN CONTENT AREA
    ════════════════════════════════════════ */
    /* CSS: Right panel — top nav + hero center */
    main {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    /* ─── TOP NAV ─── */
    /* CSS: Horizontal nav bar — centered links, matching screenshot */
    topn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px var(--s-l);
      border-bottom: 1px solid var(--bor);
      gap: var(--s-l);
      flex-shrink: 0;
    }

    navl {
      display: flex;
      align-items: center;
      gap: var(--s-l);
    }

    navl a {
      font-size: var(--fs-s);
      color: var(--c0);
      text-decoration: none;
      letter-spacing: .01em;
      font-weight: var(--fw-n);
      transition: color var(--t-fast);
      padding: 4px 0;
      position: relative;
    }
    navl a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--a);
      transition: width var(--t-fast);
    }
    navl a:hover { color: var(--c); }
    navl a:hover::after { width: 100%; }
    navl a.active { color: var(--a); }
    navl a.active::after { width: 100%; }

    /* ─── HERO AREA ─── */
    /* CSS: Centered hero with wordmark + search box */
    hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: var(--s-xl);
      gap: var(--s-l);
      position: relative;
      overflow: hidden;
    }

    /* CSS: Ambient glow background effect behind hero */
    hero::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 300px;
      background: radial-gradient(ellipse, var(--nx-glow) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      pointer-events: none;
      animation: glowPulse 4s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: .5; transform: translate(-50%, -60%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); }
    }

    /* CSS: Brand wordmark — large, light-weight, matching screenshot */
    hero hd {
      position: relative;
      z-index: 2;
      animation: fadeSlideDown .6s ease-out both;
    }

    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .wordmark {
      font-size: clamp(2.4em, 5vw, 3.8em);
      font-weight: 300;
      letter-spacing: -.03em;
      background: var(--lg-b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }

    /* ─── SEARCH BOX ─── */
    /* CSS: Main search card — white-bordered rounded box */
    hero bd {
      width: 100%;
      max-width: 680px;
      position: relative;
      z-index: 2;
      animation: fadeSlideUp .7s ease-out .15s both;
    }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    srch {
      display: flex;
      flex-direction: column;
      background: var(--bcc);
      border: 1px solid var(--bor);
      border-radius: var(--br-l);
      box-shadow: var(--bs-bs);
      overflow: hidden;
      transition: border-color var(--t-fast), box-shadow var(--t-fast);
    }
    srch:focus-within {
      border-color: rgb(58 250 203 / 30%);
      box-shadow: 0 0 0 3px var(--a-t), var(--bss);
    }

    /* CSS: Search textarea area */
    srch bd {
      padding: var(--s-m) var(--s-l);
    }

    srch bd textarea {
      width: 100%;
      background: none;
      border: none;
      outline: none;
      color: var(--c);
      font-family: var(--ff);
      font-size: var(--fs-m);
      font-weight: var(--fw-n);
      resize: none;
      line-height: var(--lh);
      min-height: 44px;
      max-height: 200px;
    }
    srch bd textarea::placeholder { color: var(--c0); }

    /* CSS: Search footer — actions toolbar */
    srch ft {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--s-s) var(--s-m);
      border-top: 1px solid var(--bor);
      background: var(--bc);
    }

    .srch-left {
      display: flex;
      align-items: center;
      gap: var(--s-xs);
    }

    .srch-right {
      display: flex;
      align-items: center;
      gap: var(--s-s);
    }

    /* CSS: Small toolbar buttons */
    .tool-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: 1px solid var(--bor);
      border-radius: var(--br-m);
      color: var(--c0);
      cursor: pointer;
      padding: 5px 10px;
      font-family: var(--ff);
      font-size: var(--fs-s);
      transition: background var(--t-fast), color var(--t-fast), border-color var(--t-fast);
    }
    .tool-btn:hover {
      background: var(--bc-t);
      color: var(--c);
      border-color: var(--b-t22);
    }
    .tool-btn i { font-size: 11px; }

    /* CSS: Icon-only small button */
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      background: none;
      border: 1px solid var(--bor);
      border-radius: var(--br-s);
      color: var(--c0);
      cursor: pointer;
      font-size: 12px;
      transition: background var(--t-fast), color var(--t-fast);
    }
    .icon-btn:hover { background: var(--bc-t); color: var(--c); }

    /* CSS: Model selector pill */
    .model-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      color: var(--c0);
      cursor: pointer;
      font-family: var(--ff);
      font-size: var(--fs-s);
      transition: color var(--t-fast);
    }
    .model-btn:hover { color: var(--c); }
    .model-btn i { font-size: 9px; }

    /* CSS: Mic button — subtle icon */
    .mic-btn {
      background: none;
      border: none;
      color: var(--c0);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      transition: color var(--t-fast);
    }
    .mic-btn:hover { color: var(--a); }

    /* CSS: Submit button — teal gradient circle with waveform icon */
    .submit-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--btn);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--b);
      font-size: 14px;
      box-shadow: 0 0 14px var(--nx-glow);
      transition: box-shadow var(--t-fast), transform var(--t-fast);
    }
    .submit-btn:hover {
      box-shadow: 0 0 22px var(--nx-glow-strong);
      transform: scale(1.07);
    }

    /* CSS: Plus add button */
    .plus-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid var(--bor);
      border-radius: var(--br-xs);
      color: var(--c0);
      cursor: pointer;
      font-size: 13px;
      transition: background var(--t-fast), color var(--t-fast);
    }
    .plus-btn:hover { background: var(--bc-t); color: var(--c); }

    /* ─── SIDEBAR COLLAPSED STATE ─── */
    app.collapsed sdbar { width: 52px; min-width: 52px; }
    app.collapsed sdbar hd { justify-content: center; }
    app.collapsed navi span { display: none; }
    app.collapsed .signin-label,
    app.collapsed .signin-expand { display: none; }
    app.collapsed .no-threads { display: none; }
    app.collapsed .sdbar-toggle { display: none; }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 640px) {
      sdbar { width: 52px; min-width: 52px; }
      sdbar hd { justify-content: center; }
      navi span { display: none; }
      .signin-label, .signin-expand { display: none; }
      .no-threads { display: none; }
      .sdbar-toggle { display: none; }
    }
  </style>
</head>
<body>

<!-- HTML: App root wrapper -->
<app id="app">

  <!-- HTML: Left sidebar navigation -->
  <sdbar>

    <!-- HTML: Sidebar header — logo + collapse toggle -->
    <hd>
      <div class="logo-icon">
        <i class="fa-solid fa-asterisk"></i>
      </div>
      <button class="sdbar-toggle" id="collapseBtn" title="Toggle sidebar">
        <i class="fa-regular fa-sidebar"></i>
      </button>
    </hd>

    <!-- HTML: Sidebar body — nav items list -->
    <bd>

      <!-- HTML: Nav item — New -->
      <navi class="active" onclick="setActive(this)">
        <i class="fa-solid fa-plus"></i>
        <span>New</span>
      </navi>

      <!-- HTML: Nav item — Computer -->
      <navi onclick="setActive(this)">
        <i class="fa-regular fa-desktop"></i>
        <span>Computer</span>
      </navi>

      <!-- HTML: Nav item — Spaces -->
      <navi onclick="setActive(this)">
        <i class="fa-regular fa-object-group"></i>
        <span>Spaces</span>
      </navi>

      <!-- HTML: Nav item — Artefacts -->
      <navi onclick="setActive(this)">
        <i class="fa-regular fa-layer-group"></i>
        <span>Artefacts</span>
      </navi>

      <!-- HTML: Nav item — Customise -->
      <navi onclick="setActive(this)">
        <i class="fa-regular fa-circle-half-stroke"></i>
        <span>Customise</span>
      </navi>

      <!-- HTML: Nav item — History -->
      <navi onclick="setActive(this)">
        <i class="fa-regular fa-clock-rotate-left"></i>
        <span>History</span>
      </navi>

      <!-- HTML: Empty threads placeholder -->
      <p class="no-threads">No recent threads</p>

    </bd>

    <!-- HTML: Sidebar footer — sign in row -->
    <ft>
      <div class="signin-row">
        <div class="signin-avatar">
          <i class="fa-regular fa-user"></i>
        </div>
        <span class="signin-label">Sign In</span>
        <i class="fa-solid fa-chevron-right signin-expand" style="font-size:9px;"></i>
      </div>
    </ft>

  </sdbar>

  <!-- HTML: Main content column -->
  <main>

    <!-- HTML: Top navigation bar — discover/finance/health links -->
    <topn>
      <navl>
        <a href="#" class="active">Discover</a>
        <a href="#">Finance</a>
        <a href="#">Health</a>
        <a href="#">Academic</a>
        <a href="#">Patents</a>
      </navl>
    </topn>

    <!-- HTML: Hero section — wordmark + search box -->
    <hero>

      <!-- HTML: Brand wordmark -->
      <hd>
        <h1 class="wordmark">perplexity</h1>
      </hd>

      <!-- HTML: Search box body -->
      <bd>
        <srch>

          <!-- HTML: Text input area -->
          <bd>
            <textarea
              id="searchInput"
              rows="1"
              placeholder="Type @ for connectors and sources"
              oninput="autoGrow(this)"
            ></textarea>
          </bd>

          <!-- HTML: Search toolbar footer -->
          <ft>

            <!-- HTML: Left actions: plus, search mode, image -->
            <div class="srch-left">
              <button class="plus-btn" title="Attach">
                <i class="fa-solid fa-plus"></i>
              </button>
              <button class="tool-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
                Search
                <i class="fa-solid fa-chevron-down"></i>
              </button>
              <button class="icon-btn" title="Image mode">
                <i class="fa-regular fa-image"></i>
              </button>
            </div>

            <!-- HTML: Right actions: model, mic, submit -->
            <div class="srch-right">
              <button class="model-btn">
                Model
                <i class="fa-solid fa-chevron-down"></i>
              </button>
              <button class="mic-btn" title="Voice input">
                <i class="fa-solid fa-microphone"></i>
              </button>
              <button class="submit-btn" id="submitBtn" title="Send">
                <i class="fa-solid fa-waveform-lines"></i>
              </button>
            </div>

          </ft>
        </srch>
      </bd>

    </hero>
  </main>

</app>

<script>
  // JS: Sidebar collapse toggle inferred from sidebar toggle button in screenshot
  const app = document.getElementById('app');
  const collapseBtn = document.getElementById('collapseBtn');

  collapseBtn.addEventListener('click', () => {
    app.classList.toggle('collapsed');
  });

  // JS: Active nav item switching — inferred from highlighted "New" item in sidebar
  function setActive(el) {
    document.querySelectorAll('navi').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
  }

  // JS: Auto-grow textarea on input — inferred from flexible search box height
  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 200) + 'px';
  }

  // JS: Submit button send on Enter (not Shift+Enter)
  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      // Placeholder: animate the submit button
      const btn = document.getElementById('submitBtn');
      btn.style.transform = 'scale(.9)';
      setTimeout(() => btn.style.transform = '', 150);
    }
  });

  // JS: Top nav active link switching
  document.querySelectorAll('navl a').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      document.querySelectorAll('navl a').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
    });
  });
</script>

</body>
</html>
